<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNN visualiser 3: the policy and value heads</title>
<meta name="description" content="Part 3 of how a trading card game agent's graph neural network picks a move: the policy head describes every legal move the same way from the nodes it involves and scores it with an MLP, whatever the cards, and the value head judges who is winning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Outfit:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
/* The Lantern look (docs/client-design.md), as in the card generation visualiser. */
:root {
  --shadow: #06100D; --night: #0B1612; --glass: #091310; --lantern: #7EF0D8; --text: #E6FBF4;
  --gold: #F4C76B; --muted: #A9C9BC; --parchment: #4A3726; --ink: #1C1209;
}
html, body { margin: 0; height: 100%; background: #050C0A; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
  background: var(--night); font-family: Outfit, system-ui, sans-serif; }
#world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
#arena { position: absolute; left: -1400px; top: -900px; width: 4720px; height: 2880px; background: center / cover no-repeat;
  filter: brightness(.55) saturate(.9); }
#dim { position: absolute; left: -1400px; top: -900px; width: 4720px; height: 2880px; background: #050C0A; pointer-events: none; }
.slot { position: absolute; }
.hero { position: absolute; width: 237px; height: 278px; }
.hero img { width: 100%; height: 100%; }
.hero .hname { position: absolute; left: 58px; top: 180px; width: 132px; height: 20px; display: grid; place-items: center;
  font: 400 19px "Marcellus SC", serif; color: var(--text); text-shadow: 0 1px 4px var(--shadow); white-space: nowrap; }
.hero .bar { position: absolute; left: 37px; top: 217px; height: 22px; border-radius: 4px; background: #E8364F;
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, .3); }
.hero .hp { position: absolute; left: 176px; top: 211px; width: 36px; height: 29px; display: grid; place-items: center;
  font: 800 23px/1 Outfit; color: #fff; -webkit-text-stroke: .16em var(--shadow); paint-order: stroke fill; }
#graph { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
.nlabel { font: 700 15px Outfit; fill: var(--text); paint-order: stroke; stroke: var(--shadow); stroke-width: 5px; }
.shade { position: absolute; left: 0; right: 0; pointer-events: none; }
.shade.top { top: 0; height: 220px; background: linear-gradient(rgba(6, 14, 11, .9) 25%, rgba(6, 14, 11, 0)); }
.shade.bottom { bottom: 0; height: 280px; background: linear-gradient(rgba(5, 12, 10, 0), rgba(5, 12, 10, .95) 65%); }
.title { position: absolute; left: 64px; top: 50px; font: 400 54px/1 "Marcellus SC", serif; color: var(--text); text-shadow: 0 3px 10px var(--shadow); }
.title small { display: block; margin-top: 14px; font: 500 24px/1.3 Outfit; color: var(--muted); text-shadow: none; }
.caption { position: absolute; left: 64px; bottom: 56px; max-width: 900px; }
.crumbs { font: 700 18px Outfit; color: var(--lantern); letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.what { font: 400 46px/1.15 "Marcellus SC", serif; color: var(--text); margin: 6px 0 8px; text-shadow: 0 3px 10px var(--shadow); }
.how { font: 500 23px/1.35 Outfit; color: var(--muted); }
.what .katex { font-size: .9em; } .how .katex { font-size: 1.08em; color: var(--text); }
/* Part 2's symbols, typeset by KaTeX over the SVG: centred on x, sitting on the line y. */
.tex { position: absolute; transform: translate(-50%, -80%); white-space: nowrap; line-height: 1; }

/* The feature table: one row per input feature, in the encoder's order. */
#table { position: absolute; left: 1010px; top: 128px; width: 820px; }
.group { height: 38px; display: flex; align-items: end; padding-bottom: 6px; box-sizing: border-box;
  font: 700 16px Outfit; color: var(--lantern); letter-spacing: .12em; text-transform: uppercase; }
.row { position: relative; height: 28px; font: 500 20px/28px Outfit; color: var(--text); white-space: nowrap; }
.row > * { position: absolute; top: 0; }
.row .label { left: 0; width: 230px; }
.row .raw { left: 230px; width: 90px; text-align: right; font-weight: 800; }
.row .rule { left: 350px; width: 150px; color: var(--muted); }
.row .rule b { color: var(--gold); font-weight: 800; }
.row .val { left: 510px; width: 80px; text-align: right; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
#links, #column, #layer, #maths, #heads { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }

/* The edge types lit so far, bottom right. */
#legend { position: absolute; right: 64px; bottom: 56px; width: 330px; }
#legend .item { display: flex; align-items: center; gap: 14px; height: 34px; font: 500 20px Outfit; color: var(--text); }
#legend .swatch { width: 34px; height: 4px; border-radius: 2px; }
/* Part 2's layer counter, top right. */
#chips { position: absolute; right: 64px; top: 56px; display: flex; gap: 10px; }
#chips div { padding: 6px 16px; border-radius: 999px; border: 1.5px solid rgba(126, 240, 216, .35); background: rgba(9, 19, 16, .8);
  font: 400 20px "Marcellus SC", serif; color: var(--muted); }
#chips div.on { border-color: var(--lantern); color: var(--text); box-shadow: 0 0 14px rgba(126, 240, 216, .45); }

.pcard[data-hl] { transition: none; }
.pcard[data-hl="card"] .frame { filter: drop-shadow(0 0 12px rgba(244, 199, 107, .95)); }
.pcard[data-hl="cost"] .cost, .pcard[data-hl="power"] .power, .pcard[data-hl="health"] .health {
  color: var(--gold); transform: scale(1.25); }
.pcard[data-hl="text"] .text, .pcard[data-hl="art"] .art { outline: calc(var(--u) * 1.4) solid rgba(244, 199, 107, .9);
  outline-offset: calc(var(--u) * 1); border-radius: calc(var(--u) * 3); }

#controls { position: fixed; left: 0; right: 0; bottom: 0; height: 52px; background: var(--glass); border-top: 1.5px solid rgba(160, 235, 215, .3);
  display: flex; align-items: center; gap: 14px; padding: 0 16px; color: var(--muted); font: 500 14px Outfit, system-ui; }
#controls button { font: 400 15px "Marcellus SC", serif; background: var(--glass); color: var(--lantern); border: 1.5px solid var(--lantern);
  border-radius: 999px; padding: 5px 16px; cursor: pointer; min-width: 84px; }
#controls button:active { background: rgba(126, 240, 216, .18); transform: scale(.95); }
#controls input { flex: 1; min-width: 0; accent-color: var(--lantern); }  /* a range input won't shrink below ~130 px otherwise */
@media (max-width: 480px) { #controls { gap: 8px; padding: 0 10px; } #controls button { padding: 5px 11px; } }
body.render #controls { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="arena"></div>
    <div id="board"></div>
    <div id="dim"></div>

    <svg id="graph" xmlns="http://www.w3.org/2000/svg"><g id="edges"></g><g id="nodes"></g></svg>
  </div>

  <div class="title">How the network sees the board<small>The state graph the GNN reads, one node at a time</small></div>
  <svg id="links" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="table"></div>
  <svg id="column" xmlns="http://www.w3.org/2000/svg"></svg>
  <svg id="layer" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="maths"></div>
  <svg id="heads" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="chips"></div>
  <div class="caption" id="caption"><div class="crumbs" id="crumbs"></div><div class="what" id="what"></div><div class="how" id="how"></div></div>
  <div id="legend"></div>
</div>
<div id="controls">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" step="0.001" value="0">
</div>

<!-- Card text helpers shared by the Blog's pages (painted_card.html uses abilityHtml). The pages
     include this where they say CARD_KIT. -->
<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function abilityHtml(a) {
  // Bold the trigger ("When you play this unit,"), like the client.
  const t = esc(a.text);
  if (a.kind === "triggered") { const i = t.indexOf(", "); return `<b>${t.slice(0, i + 1)}</b>${t.slice(i + 1)}`; }
  return t;
}
</script>

<!-- The card as the Unity client draws it, shared by the Blog's animations. Needs the Lantern colour tokens
     (--shadow, --parchment, --ink), card_kit.html's esc and abilityHtml, and window.CARD_ART / CARD_IMAGES
     (card_generation_visualiser.card_art). The pages include it where they say PAINTED_CARD. -->
<style>
/* The card as the Unity client draws it (ClientAssetBuilder.BuildCardPrefab): a 150x210 card in card units (--u),
   the plain painted frame (Art/Sprites/card_frame_action.png) spilling past it, the card's art behind the frame's
   window, and the sword, shield and job banner parts at the prefab's positions. Type sizes are TMP's, in card units. */
.pcard { --w: 420px; --u: calc(var(--w) / 151.24); position: relative; width: calc(var(--u) * 150); height: calc(var(--u) * 210); }
.pcard > * { position: absolute; margin: 0; }
.pcard .art { left: calc(var(--u) * 29.15); top: calc(var(--u) * 13.67); width: calc(var(--u) * 96.47); height: calc(var(--u) * 97.15);
  overflow: hidden; background: #0B1612; }
.pcard .art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }  /* CardView.ArtRaise */
.pcard.no-art .art img { visibility: hidden; }
.pcard .frame { left: calc(var(--u) * -0.6); top: calc(var(--u) * -10.9); width: calc(var(--u) * 151.24); height: calc(var(--u) * 225.4);
  filter: drop-shadow(0 calc(var(--u) * 4) 0 rgba(5, 10, 8, .5)); }
.pcard .part { height: auto; }
.pcard .num { display: grid; place-items: center; font: 800 1em/1 Outfit; color: #fff; white-space: nowrap;
  -webkit-text-stroke: .16em var(--shadow); paint-order: stroke fill; text-shadow: 0 .06em .04em rgba(6, 16, 13, .8); }
.pcard .cost { left: calc(var(--u) * 13.49); top: calc(var(--u) * 10.43); width: calc(var(--u) * 22.54); height: calc(var(--u) * 21.54); font-size: calc(var(--u) * 20); }
.pcard .sword { left: calc(var(--u) * -7.4); top: calc(var(--u) * 178.85); width: calc(var(--u) * 39.43); }
.pcard .power { left: calc(var(--u) * 4.02); top: calc(var(--u) * 190.38); width: calc(var(--u) * 22); height: calc(var(--u) * 22); font-size: calc(var(--u) * 18); }
.pcard .shield { left: calc(var(--u) * 122.94); top: calc(var(--u) * 185.1); width: calc(var(--u) * 30.07); }
.pcard .health { left: calc(var(--u) * 126.98); top: calc(var(--u) * 191); width: calc(var(--u) * 22); height: calc(var(--u) * 22); font-size: calc(var(--u) * 18); }
.pcard .banner { left: calc(var(--u) * 33.12); top: calc(var(--u) * 188.57); width: calc(var(--u) * 88); }
.pcard .job { left: calc(var(--u) * 41.12); top: calc(var(--u) * 196.87); width: calc(var(--u) * 70.5); height: calc(var(--u) * 11.4);
  display: grid; place-items: center; white-space: nowrap; overflow: hidden; font: 700 calc(var(--u) * 9) Outfit; letter-spacing: .04em; color: var(--ink); }
.pcard .name { left: calc(var(--u) * 23.63); top: calc(var(--u) * 112.17); width: calc(var(--u) * 105.94); height: calc(var(--u) * 16.9);
  display: grid; place-items: center; white-space: nowrap; overflow: hidden; font: 400 calc(var(--u) * 14.5) "Marcellus SC", serif;
  letter-spacing: -.03em; color: var(--ink); -webkit-text-stroke: .025em var(--ink); text-shadow: 0 .07em 0 rgba(255, 242, 204, .35); }
.pcard .sub { left: calc(var(--u) * 48.99); top: calc(var(--u) * 132); width: calc(var(--u) * 54.66); height: calc(var(--u) * 10.14);
  display: grid; place-items: center; white-space: nowrap; overflow: hidden; font: italic 500 calc(var(--u) * 8.5) Outfit; color: var(--parchment); }
.pcard .text { left: calc(var(--u) * 27.41); top: calc(var(--u) * 144.59); width: calc(var(--u) * 98.22); height: calc(var(--u) * 43.98);
  display: flex; flex-direction: column; justify-content: safe center; overflow: hidden; text-align: center;
  font: 500 calc(var(--u) * 10)/1.12 Outfit; color: var(--parchment); }
.pcard .text b { font-weight: 800; color: var(--ink); }
.pcard.action .unit-only { display: none; }
.pcard .num.down { color: #FF8A96; }  /* Palette.StatDown: health below the printed value */
</style>
<script>
function paintedCard(c, kind, art) {
  // The card like the client's CardView: units and actions share the frame; units add the sword and shield.
  // c.art shows the art (the visualiser hides it until the card is named); c.damaged colours the health;
  // c.placeholder is markup for the art window when the card has no image (the card lab's mushrooms).
  const unit = c.type === "unit", parts = window.CARD_ART, image = window.CARD_IMAGES[art];
  const kw = c.keywords.map((k) => `<b>${esc(k)}.</b>`).join(" ");
  const job = unit ? c.traits.filter(Boolean).join(" · ") : "Action";
  return `<div class="pcard ${unit ? "" : "action"} ${c.art && image ? "" : "no-art"}">
    <div class="art">${image ? `<img src="${image}" alt="">` : c.placeholder || ""}</div>
    <img class="frame" src="${parts.card_frame}" alt="">
    <div class="num cost">${c.cost}</div>
    <div class="name">${esc(c.name)}</div>
    <div class="sub">${esc(c.subtitle)}</div>
    <div class="text"><div>${kw ? kw + "<br>" : ""}${abilityHtml({ kind, text: c.text })}</div></div>
    <img class="part banner" src="${parts.card_job_banner}" alt=""><div class="job">${esc(job)}</div>
    <img class="part sword unit-only" src="${parts.card_attack}" alt=""><div class="num power unit-only">${c.power}</div>
    <img class="part shield unit-only" src="${parts.card_defence}" alt=""><div class="num health unit-only${c.damaged ? " down" : ""}">${c.health}</div>
  </div>`;
}

function fitPainted(root) {
  // Shrink to fit between the client's auto-size bounds (name 14.5 → 7, subtitle 8.5 → 5, text 10 → 5, job 9 → 4 card units).
  const unit = parseFloat(getComputedStyle(root.querySelector(".pcard")).getPropertyValue("--w")) / 151.24;
  const fit = (selector, max, min, fits) => {
    const el = root.querySelector(selector);
    for (let size = max; size >= min; size -= 0.25) {
      el.style.fontSize = size * unit + "px";
      if (fits(el)) break;
    }
  };
  const wide = (el) => el.scrollWidth <= el.clientWidth + 1;
  fit(".name", 14.5, 7, wide);
  fit(".sub", 8.5, 5, wide);
  fit(".text", 10, 5, (el) => el.scrollHeight <= el.clientHeight + 1);
  fit(".job", 9, 4, wide);
}

function stageScale() { return $("stage").getBoundingClientRect().width / W; }

const EDGE_TEXT = {
  belongs_to: ["Belongs to", "Each card is joined to its owner's player node."],
  faces: ["Faces", "Every unit is joined to every enemy unit in play: who could fight whom."],
  part_of: ["Part of", "The card's ability is a small graph of its own, joined to the card."],
  matches: ["Matches", "Ability nodes that could pick this card: Honey Chef's “your other Lamplighters”, and each enemy Baker's “chosen enemy unit”."],
};
function legend(t) {

      el.insertAdjacentHTML("beforeend", `<div class="item" data-type="${type}"><span class="swatch" style="background:${EDGE_STYLES[type][0]}"></span>

// ------------------------------------------------------------------ part 2: one GNN layer
// Like the schematic in the client's layer inspector: the node x_i with its neighbours x_j on an arc above it.
// Every vector carries its length. Head 1 of the faces edge type is worked through in full.
const LANES = LAYER.edge_types.slice().sort((a, b) => EDGE_ORDER.indexOf(a.shown_as) - EDGE_ORDER.indexOf(b.shown_as));
const SENDERS = LANES.flatMap((et) => et.neighbours.map((nb) => ({ et, nb })));
const FACES = LANES.find((et) => et.shown_as === "faces"), HEAD = 0;
const NB1 = FACES.neighbours[0], NB2 = FACES.neighbours[1];  // the most attended first
const HUB = { x: 470, y: 770, size: 96 }, RING = { rx: 390, ry: 430 }, NB_SIZE = 64;
const leaky = (v) => (v > 0 ? v : LAYER.negative_slope * v);
const PRE = NB1.value[HEAD].map((v, c) => v + FACES.query[HEAD][c]);
const fmt = (x) => (x < 0 ? "−" : "") + Math.abs(x).toFixed(2);
const shortName = (id) => (NODES[id].type === "ability" ? NODES[NODES[id].card].label : NODES[id].label);

function reach(t) {
  // How many edges away the focus node has heard from, in the four-layers beat.
  const done = [0, 1, 2, 3].filter((k) => t >= L.layer + k * L.layerStep).length;
  return Math.min(done, Math.max(...Object.values(LAYERS.hops)));
}
function layerAt(t) { return t >= L.reach ? [0, 1, 2, 3].filter((k) => t >= L.layer + k * L.layerStep).length : 0; }

// Maths is written as $...$ and typeset by KaTeX (the page still reads if it doesn't load).
const tex = (src) => (window.katex ? katex.renderToString(src, { throwOnError: false }) : esc(src));
const rich = (text) => text.split(/\$([^$]+)\$/).map((part, i) => (i % 2 ? tex(part) : esc(part))).join("");
function mathLabel(src, size, colour) {
  // An HTML label over #layer, standing in for an SVG <text>: place() it, and style.opacity multiplies its group's.
  const el = document.createElement("div");
  el.className = "tex"; el.style.fontSize = `${size}px`; el.style.color = colour; el.innerHTML = tex(src);
  $("maths").appendChild(el);
  let group = 1, own = 1;
  const apply = () => { el.style.opacity = group * own; };
  return { style: { set opacity(v) { own = +v; apply(); } },
           place(x, y, opacity) { el.style.left = `${x}px`; el.style.top = `${y}px`; group = opacity; apply(); } };
}
const isMath = (s) => s?.startsWith("$");

function makeCol(parent, values, opts = {}) {
  // A vector as a column of cells, its length on its top right; set() places it with a cell height.
  const g = svg("g", {}, parent), inner = svg("g", {}, g), scale = opts.scale ?? spread(values);
  values.forEach((v, i) => svg("rect", { x: 0, y: i, width: 1, height: 1.04, fill: glyphColour(v, scale) }, inner));
  const frame = svg("rect", { fill: "none", stroke: opts.colour || "rgba(160,235,215,.45)", "stroke-width": 1.5 }, g);
  const tag = svg("text", { fill: "#A9C9BC", "font-family": "Outfit", "font-weight": 700, "font-size": 15 }, g);
  tag.textContent = values.length;
  const label = isMath(opts.label) ? mathLabel(opts.label.slice(1, -1), 22, opts.labelColour || "#E6FBF4")
    : svg("text", { fill: opts.labelColour || "#E6FBF4", "font-family": "Outfit", "font-weight": 700, "font-size": 18, "text-anchor": "middle" }, g);
  if (!label.place) label.textContent = opts.label || "";
  return {
    g, n: values.length, label,
    set(x, y, w, cell, opacity = 1, tagX = null) {
      const h = cell * this.n;
      inner.setAttribute("transform", `translate(${x} ${y}) scale(${w} ${cell})`);
      for (const [k, v] of Object.entries({ x, y, width: w, height: h })) frame.setAttribute(k, v);
      tag.setAttribute("x", tagX ?? x + w + 6); tag.setAttribute("y", y + 12);
      if (label.place) label.place(x + w / 2, y - 12, opacity);
      else { label.setAttribute("x", x + w / 2); label.setAttribute("y", y - 12); }
      g.style.opacity = opacity;

    },
  };
}
function makeBox(parent, title, sub, atTop = false) {
  const g = svg("g", {}, parent);
  const rect = svg("rect", { rx: 12, fill: "rgba(9,19,16,.92)", stroke: "rgba(126,240,216,.7)", "stroke-width": 2 }, g);
  const a = isMath(title) ? mathLabel(title.slice(1, -1), 30, "#E6FBF4")
    : svg("text", { "text-anchor": "middle", fill: "#E6FBF4", "font-family": "Marcellus SC", "font-size": 24 }, g);
  const b = svg("text", { "text-anchor": "middle", fill: "#A9C9BC", "font-family": "Outfit", "font-weight": 500, "font-size": 16 }, g);
  if (!a.place) a.textContent = title;
  b.textContent = sub || "";
  return { g, set(x, y, w, h, opacity) {
    for (const [k, v] of Object.entries({ x, y, width: w, height: h })) rect.setAttribute(k, v);
    const ty = atTop ? y + 40 : y + h / 2 + (sub ? -2 : 8);
    if (a.place) a.place(x + w / 2, ty, opacity);
    else { a.setAttribute("x", x + w / 2); a.setAttribute("y", ty); }

}
function makeText(parent, attrs, text = "") {

  el.textContent = text;
  el.put = (x, y, opacity, value) => {
    el.setAttribute("x", x); el.setAttribute("y", y); el.style.opacity = opacity;
    if (value !== undefined) el.textContent = value;
  };

}
function makeDisc(parent, colour, values, size) {

  const g = svg("g", {}, parent);
  const outer = svg("circle", { fill: colour, stroke: "#06100D", "stroke-width": 1.5 }, g);

const P2 = {};
function buildLayer() {
  const root = $("layer");
  P2.bands = svg("g", {}, root);
  P2.edges = SENDERS.map(({ et }) => svg("line", { stroke: EDGE_STYLES[et.shown_as][0], "stroke-linecap": "round" }, root));
  P2.discs = SENDERS.map(({ et, nb }) => {
    const d = makeDisc(root, NODE_COLOURS[et.source], nb.embedding, NB_SIZE);
    const name = svg("text", { class: "nlabel", "text-anchor": "middle" }, root);
    // Another card's ability node: its card, then the part; the focus card's own: just the part.
    const n = NODES[nb.node], own = n.type === "ability" && n.card === FOCUS;
    const lines = n.type !== "ability" ? [n.label] : own ? [n.label] : [shortName(nb.node), n.label];
    name.innerHTML = lines.map((l, i) => `<tspan x="0" dy="${i ? 17 : 0}">${esc(l)}</tspan>`).join("");
    d.name = name;
    return d;
  });
  P2.tags = SENDERS.map(() => makeText(root, { "font-size": 22, fill: "#F4C76B", stroke: "#06100D", "stroke-width": 6, "paint-order": "stroke" }));
  P2.hub = makeDisc(root, NODE_COLOURS.card, LAYER.input.vector, HUB.size);
  P2.hubAfter = makeDisc(root, NODE_COLOURS.card, LAYER.output.vector, HUB.size);
  P2.hubName = makeText(root, { class: "nlabel", "font-size": 18 }, card().label);

  // The score for one neighbour, GATv2's: W_l x_j and W_r x_i, added, LeakyReLU, then a dot product with a.
  const head = FACES.query[HEAD].length;
  P2.xj = makeCol(root, NB1.embedding, { label: "$\\mathbf{x}_j$" });
  P2.xi = makeCol(root, LAYER.input.vector, { label: "$\\mathbf{x}_i$" });
  P2.wl = makeBox(root, "$\\mathbf{W}_l$", `${NB1.embedding.length} → ${head}`);
  P2.wr = makeBox(root, "$\\mathbf{W}_r$", `${LAYER.input.vector.length} → ${head}`);
  P2.wlxj = makeCol(root, NB1.value[HEAD], { label: "$\\mathbf{W}_l\\mathbf{x}_j$" });
  P2.wrxi = makeCol(root, FACES.query[HEAD], { label: "$\\mathbf{W}_r\\mathbf{x}_i$" });
  P2.pre = makeCol(root, PRE, { label: "sum" });
  P2.lrelu = makeBox(root, "LeakyReLU", `negatives × ${LAYER.negative_slope}`);
  P2.leaky = makeCol(root, PRE.map(leaky));
  P2.a = makeCol(root, FACES.att[HEAD], { label: "$\\mathbf{a}$", colour: "rgba(244,199,107,.7)" });
  P2.plus = makeText(root, { "font-size": 40 }, "+");
  P2.dot = makeText(root, { "font-size": 44 }, "·");
  P2.eq = makeText(root, { "font-size": 40 }, "=");
  P2.score = makeText(root, { "font-size": 40, fill: "#F4C76B", "text-anchor": "start" }, fmt(NB1.scores[HEAD]));

  // Softmax, then the weighted sum of the values.
  P2.soft = makeBox(root, "Softmax", "scores → attention, adding up to 1", true);
  P2.softRows = FACES.neighbours.map((nb) => makeText(root, { "font-size": 22, "font-weight": 500, "text-anchor": "start" },
    `${shortName(nb.node)}   ${fmt(nb.scores[HEAD])}  →  ${nb.attention[HEAD].toFixed(3)}`));
  P2.values = FACES.neighbours.map((nb) => makeCol(root, nb.value[HEAD], { label: shortName(nb.node) }));
  P2.times = FACES.neighbours.map((nb) => makeText(root, { "font-size": 26, fill: "#F4C76B" }, `× ${nb.attention[HEAD].toFixed(3)}`));
  P2.weighted = FACES.neighbours.map((nb, k) => makeCol(root, nb.weighted[HEAD], { scale: spread(nb.value[HEAD]) }));
  P2.plus2 = makeText(root, { "font-size": 40 }, "+");
  P2.heads = FACES.heads.map((h, k) => makeCol(root, h, { label: `head ${k + 1}`, scale: spread(FACES.heads.flat()) }));
  P2.headNames = FACES.heads.map((_, k) => makeText(root, { "font-size": 17, fill: "#A9C9BC", "text-anchor": "end", "font-weight": 700 }, `head ${k + 1}`));
  P2.bias = makeText(root, { "font-size": 18, fill: "#A9C9BC", "font-weight": 500 }, "joined, + bias");

  // Every edge type's message, added; ReLU; the input added back; LayerNorm.
  P2.msgs = LANES.map((et) => makeCol(root, et.message, { label: EDGE_TEXT[et.shown_as][0], labelColour: EDGE_STYLES[et.shown_as][0],
    colour: EDGE_STYLES[et.shown_as][0] }));
  P2.sum = makeCol(root, LAYER.sum.vector, { label: "Σ messages" });
  P2.reluBox = makeBox(root, "ReLU", "negatives → 0");
  P2.relu = makeCol(root, LAYER.relu.vector, { label: "ReLU" });
  P2.xi2 = makeCol(root, LAYER.input.vector, { label: "$\\mathbf{x}_i$" });
  P2.plus3 = makeText(root, { "font-size": 40 }, "+");
  P2.res = makeCol(root, LAYER.residual.vector, { label: "added" });
  P2.normBox = makeBox(root, "LayerNorm", "a steady spread");
  P2.out = makeCol(root, LAYER.output.vector, { label: "$\\mathbf{x}_i'$" });

  $("chips").innerHTML = [1, 2, 3, 4].map((k) => `<div>Layer ${k}</div>`).join("");
}

function band(from, to, opacity, parent = P2.bands) {
  if (opacity <= 0) return;
  const mx = (from.x + to.x) / 2;
  svg("path", { d: `M${from.x} ${from.y0} C${mx} ${from.y0} ${mx} ${to.y0} ${to.x} ${to.y0} L${to.x} ${to.y1}
    C${mx} ${to.y1} ${mx} ${from.y1} ${from.x} ${from.y1} Z`, fill: "rgba(126,240,216,.06)", stroke: "rgba(126,240,216,.2)",
    "stroke-width": 1, opacity }, parent);

const rectOf = (b) => ({ x: b.x, y: b.y, w: b.w, h: b.h });

function layerScene(t, c) {

  $("maths").style.opacity = on;
  $("world").style.opacity = 1 - span(t, L.fan, L.fanEnd) + span(t, L.reach, L.reachEnd);
  $("chips").style.opacity = span(t, L.reach + 0.6, L.reachEnd + 0.4) * (1 - span(t, HD.move, HD.move + 0.6));

  const dt = span(t, L.dot, L.dot + 0.5), sc = span(t, L.dot + 0.6, L.dot + 1.1);
  P2.dot.put(1678, mid + 12, dt * math);
  P2.a.set(1698, mid - H32 / 2, 26, CELL, dt * math);
  P2.eq.put(1752, mid + 14, sc * math);
  // The score, then flown to its edge.
  const sf = span(t, L.scoreFly, L.scoreFly + 0.8);
  const k1 = SENDERS.findIndex((x) => x.nb === NB1);
  const edgeTag = { x: +P2.tags[k1].getAttribute("x") || 0, y: +P2.tags[k1].getAttribute("y") || 0 };
  P2.score.setAttribute("text-anchor", sf > 0 ? "middle" : "start");
  P2.score.put(lerp(1772, edgeTag.x, sf), lerp(mid + 15, edgeTag.y, sf), sc * (1 - span(t, L.scoreFly + 0.6, L.scoreFly + 0.8)));

  // Softmax over the faces scores, then the values weighted by attention and added.
  const sm = span(t, L.softmax, L.softmax + 0.5) * (1 - span(t, L.values - 0.4, L.values));
  P2.soft.set(1000, 300, 640, 220, sm);
  P2.softRows.forEach((row, k) => row.put(1040, 430 + k * 44, sm));
  const v = span(t, L.values, L.values + 0.6), w = span(t, L.weigh, L.weigh + 0.8), hs = span(t, L.headSum, L.headSum + 0.8);
  const stack = span(t, L.heads, L.heads + 1.0), joined = span(t, L.heads + 2.0, L.heads + 2.6);
  const gone = 1 - span(t, L.types, L.types + 0.6);
  [0, 1].forEach((k) => {
    const y = k === 0 ? 270 : 560;
    P2.values[k].set(1000, y, 26, CELL, v * (1 - hs));
    P2.times[k].put(1100, y + H32 / 2 + 9, span(t, L.weigh - 0.2, L.weigh + 0.3) * (1 - hs));
    const into = blendRect({ x: 1200, y, w: 26, h: H32 }, { x: 1360, y: 415 - H32 / 2, w: 26, h: H32 }, hs);
    P2.weighted[k].set(into.x, into.y, 26, CELL, w * (1 - span(t, L.headSum + 0.6, L.headSum + 0.8)));
  });
  P2.plus2.put(1290, 430, w * (1 - hs));
  // Four heads: head 1 drops into the top quarter; the others join below it into the 128-number message.
  const top = 300;
  P2.heads.forEach((col, k) => {
    const from = k === 0 ? { x: 1360, y: 415 - H32 / 2 } : { x: 1700, y: top + k * H32 };
    const b = blendRect({ ...from, w: 26, h: H32 }, { x: 1560, y: top + k * H32, w: 26, h: H32 }, stack);
    const shown = k === 0 ? span(t, L.headSum + 0.6, L.headSum + 0.8) : span(t, L.heads + 0.3 + 0.3 * k, L.heads + 0.6 + 0.3 * k);
    col.set(b.x, b.y, 26, CELL, shown * (1 - joined));
    col.label.style.opacity = k === 0 ? 1 - stack : 0;
    P2.headNames[k].put(1545, top + k * H32 + H32 / 2 + 6, shown * stack * gone);
  });
  P2.bias.put(1573, top + 4 * H32 + 30, joined * gone);

  // Every edge type's message (the faces one from its heads), then added up.
  const merge = span(t, L.merge, L.merge + 1.0);
  LANES.forEach((et, k) => {
    const isFaces = et === FACES, slot = { x: 1000 + k * 130, y: top };
    const from = isFaces ? { x: 1560, y: top } : slot;
    const b = blendRect(blendRect({ ...from, w: 26, h: 128 * CELL }, { ...slot, w: 26, h: 128 * CELL }, others),
                        { x: 1000, y: top, w: 26, h: 128 * CELL }, merge);
    const shown = isFaces ? joined : span(t, L.types + 0.4 + 0.4 * k, L.types + 0.9 + 0.4 * k);
    P2.msgs[k].set(b.x, b.y, 26, CELL, shown * (1 - span(t, L.merge + 0.8, L.merge + 1.0)));
  });
  // Σ, ReLU, + x_i, LayerNorm, along one row; then the new x_i goes into the node.
  const r = span(t, L.relu, L.relu + 0.5), x2 = span(t, L.resid, L.resid + 0.9), nm = span(t, L.norm, L.norm + 0.5);
  const dock = span(t, L.dock, L.dockEnd), after = 1 - dock;
  P2.sum.set(1000, top, 26, CELL, span(t, L.merge + 0.8, L.merge + 1.0) * after);
  P2.reluBox.set(1056, top + 64 * CELL - 46, 130, 92, r * after);
  band({ x: 1026, y0: top, y1: top + 128 * CELL }, { x: 1056, y0: top + 64 * CELL - 46, y1: top + 64 * CELL + 46 }, r * after);
  band({ x: 1186, y0: top + 64 * CELL - 46, y1: top + 64 * CELL + 46 }, { x: 1216, y0: top, y1: top + 128 * CELL }, r * after);
  P2.relu.set(1216, top, 26, CELL, span(t, L.relu + 0.3, L.relu + 0.8) * after);
  const xiFrom = { x: hubCol.x, y: hubCol.y, w: hubCol.w, h: hubCol.cell * 128 };
  const xiB = blendRect(xiFrom, { x: 1320, y: top, w: 26, h: 128 * CELL }, x2);
  P2.xi2.set(xiB.x, xiB.y, xiB.w, xiB.h / 128, (t >= L.resid ? 1 : 0) * after);
  P2.plus3.put(1281, top + 64 * CELL + 14, span(t, L.resid + 0.6, L.resid + 0.9) * after);
  P2.res.set(1420, top, 26, CELL, span(t, L.resid + 1.0, L.resid + 1.4) * after);
  P2.normBox.set(1490, top + 64 * CELL - 46, 170, 92, nm * after);
  band({ x: 1446, y0: top, y1: top + 128 * CELL }, { x: 1490, y0: top + 64 * CELL - 46, y1: top + 64 * CELL + 46 }, nm * after);
  band({ x: 1660, y0: top + 64 * CELL - 46, y1: top + 64 * CELL + 46 }, { x: 1700, y0: top, y1: top + 128 * CELL }, nm * after);
  const out = blendRect({ x: 1700, y: top, w: 26, h: 128 * CELL }, { x: hubCol.x, y: hubCol.y, w: hubCol.w, h: hubCol.cell * 128 }, dock);
  P2.out.set(out.x, out.y, out.w, out.h / 128, span(t, L.norm + 0.4, L.norm + 0.9) * (t < L.dockEnd ? 1 : 0));
  P2.out.label.style.opacity = after;
}

function layerBeats() {
  const n = FACES.neighbours.length, head = FACES.query[HEAD].length, heads = FACES.heads.length;
  const maxHop = Math.max(...Object.values(LAYERS.hops));
  return [
    [L.fan, "Part 2 · One layer", "Messages along the edges", `A GATv2 layer lets each node gather from its neighbours, using attention to weigh them. Every vector is now ${EMB.hidden} numbers: each node type has its own encoder.`],
    [L.faces, "One edge type", "Start with Faces", `Each edge type has its own weights. Here, the ${n} enemy units this card faces.`],
    [L.fly, `Faces · head 1 · ${shortName(NB1.node)}`, "Two learned matrices, $\\mathbf{W}_l$ and $\\mathbf{W}_r$", `$\\mathbf{W}_l$ reads the neighbour $\\mathbf{x}_j$, $\\mathbf{W}_r$ the card itself $\\mathbf{x}_i$: each turns ${EMB.hidden} numbers into ${head}.`],
    [L.add, `Faces · head 1 · ${shortName(NB1.node)}`, "Added, then LeakyReLU", `LeakyReLU keeps positive numbers and shrinks negative ones to ${LAYER.negative_slope} of their size.`],
    [L.dot, `Faces · head 1 · ${shortName(NB1.node)}`, "A dot product with $\\mathbf{a}$ gives a score", `$\\mathbf{a}$ is learned too: ${head} numbers saying what matters. One number, how relevant this neighbour is: $e_{ij} = \\mathbf{a}^{\\top}\\,\\mathrm{LeakyReLU}(\\mathbf{W}_l\\mathbf{x}_j + \\mathbf{W}_r\\mathbf{x}_i)$.`],
    [L.sibling, "Faces · head 1", "Every neighbour of the kind gets a score", `${shortName(NB2.node)} is scored the same way: ${fmt(NB2.scores[HEAD])}.`],
    [L.softmax, "Faces · head 1", "Softmax turns scores into attention", `$\\alpha_{ij} = \\mathrm{softmax}_j(e_{ij})$: positive, and adding up to 1. Here ${shortName(NB1.node)} gets ${Math.round(NB1.attention[HEAD] * 100)}% of this head's attention.`],
    [L.values, "Faces · head 1", "The weighted values are added", `$\\mathbf{W}_l\\mathbf{x}_j$ is also what each neighbour sends. Weighted by attention and added, $\\sum_j \\alpha_{ij}\\mathbf{W}_l\\mathbf{x}_j$ makes head 1's ${head} numbers.`],
    [L.heads, "Faces · all heads", `${heads} heads, joined`, `Each head has its own $\\mathbf{W}_l$, $\\mathbf{W}_r$ and $\\mathbf{a}$, so each can look for something different. ${heads} × ${head} numbers make the ${EMB.hidden}-number message.`],
    [L.types, "Every edge type", "Each edge type sends its own message", "Belongs to, faces, part of and matches: the same steps, each with its own weights. The messages are added."],
    [L.relu, "After the messages", "ReLU", "Negative numbers become 0."],
    [L.resid, "After the messages", "The card's own vector is added back", "A residual connection: the layer only has to learn what to change."],
    [L.norm, "After the messages", "LayerNorm", `It rescales the ${EMB.hidden} numbers to a steady spread, so every layer starts from the same range.`],
    [L.dock, "Layer 1 done", `The card's new ${EMB.hidden} numbers`, "Every node does this at once, each from its own neighbours."],
    [L.reach, "Four layers", "Four layers, each with its own weights", maxHop <= 2
      ? `After layer 1 the card has heard from its neighbours; after layer 2, from theirs, which on this small board is everything. Layers 3 and 4 keep mixing.`
      : "Each layer reaches one edge further."],
  ];
}

// ------------------------------------------------------------------ part 3: the policy and value heads
// GNNNet.forward: each legal action's six slots joined and scored by the policy MLP, a softmax over the
// actions; the game node and both player nodes joined and turned into a value by the value MLP and tanh.
const HEADS = D.heads, ACTIONS = HEADS.actions, WALK = ACTIONS[HEADS.walk], VALUE = HEADS.value;
const BEST = ACTIONS.reduce((b, a, i) => (a.probability > ACTIONS[b].probability ? i : b), 0);
// The client's overlay colours for what each head reads (GraphOverlay.SlotColours, ValueSlotColours).
const SLOTS = [["type", "#B7C4BE"], ["actor", "#FFE14D"], ["target", "#FF4D5E"], ["context", "#22BCC9"],
  ["option", "#FF6FD8"], ["game", "#E9EEF8"]];
const SLOT_KEYS = [null, "actor", "target", "context", "option", "global"];
const VALUE_SLOTS = [["game", "#E9EEF8"], ["you", "#4ADE80"], ["opponent", "#FF9F43"]];
const HCELL = 2.0, HTOP = 520, HH = 128 * HCELL;
const P3 = {};

function buildHeads() {
  const root = $("heads");
  P3.bands = svg("g", {}, root);
  P3.lines = svg("g", {}, root);
  // The legal actions: a row each, with its score and then its probability.
  P3.panel = svg("rect", { x: 950, y: 140, width: 910, height: 56 + ACTIONS.length * 38, rx: 14, fill: "rgba(9,19,16,.88)",
    stroke: "rgba(160,235,215,.3)", "stroke-width": 1.5 }, root);
  P3.panelTitle = makeText(root, { "font-size": 17, fill: "#7EF0D8", "text-anchor": "start", "letter-spacing": "2" }, "LEGAL ACTIONS");
  P3.panelHead = makeText(root, { "font-size": 15, fill: "#A9C9BC", "text-anchor": "end", "font-weight": 700 }, "score");
  P3.rows = ACTIONS.map((a, i) => {
    const g = svg("g", {}, root);
    const hl = svg("rect", { x: 958, y: 0, width: 894, height: 34, rx: 8, fill: "rgba(126,240,216,.12)", stroke: "rgba(126,240,216,.6)" }, g);
    const text = makeText(g, { "font-size": 20, "font-weight": 500, "text-anchor": "start" }, a.text.replace("Attack: ", "Attack "));
    const score = makeText(g, { "font-size": 20, fill: "#F4C76B", "text-anchor": "end" }, fmt(a.logit));
    const bar = svg("rect", { x: 1640, height: 14, rx: 3, fill: "#7EF0D8" }, g);
    const pct = makeText(g, { "font-size": 18, "text-anchor": "end", fill: "#E6FBF4" }, `${(a.probability * 100).toFixed(a.probability < 0.01 ? 1 : 0)}%`);
    return { g, hl, text, score, bar, pct };
  });
  // The walked-through action's six slots, joined, the MLP, the score.
  P3.slots = WALK.slots.map((v, k) => makeCol(root, v, { label: SLOTS[k][0], labelColour: SLOTS[k][1], colour: SLOTS[k][1] }));
  P3.slotNotes = WALK.slots.map((_, k) => makeText(root, { "font-size": 14, fill: "#A9C9BC", "font-weight": 500 },
    k === 0 ? "learned" : WALK[SLOT_KEYS[k]] == null ? "empty" : ""));
  P3.joined = makeCol(root, WALK.slots.flat(), { label: "joined" });
  P3.mlp = makeBox(root, "Policy MLP", `${WALK.slots.flat().length} → ${WALK.hidden.length} → 1`);
  P3.hidden = makeCol(root, WALK.hidden, { label: "ReLU" });
  P3.score = makeText(root, { "font-size": 40, fill: "#F4C76B", "text-anchor": "start" }, fmt(WALK.logit));
  P3.softmax = makeText(root, { "font-size": 17, fill: "#7EF0D8", "text-anchor": "end", "font-weight": 700 }, "softmax");
  // The value head.
  P3.vslots = VALUE.inputs.map((v, k) => makeCol(root, v, { label: VALUE_SLOTS[k][0], labelColour: VALUE_SLOTS[k][1], colour: VALUE_SLOTS[k][1] }));
  P3.vjoined = makeCol(root, VALUE.inputs.flat(), { label: "joined" });
  P3.vmlp = makeBox(root, "Value MLP", `${VALUE.inputs.flat().length} → ${VALUE.hidden.length} → 1`);
  P3.vhidden = makeCol(root, VALUE.hidden, { label: "ReLU" });
  P3.raw = makeText(root, { "font-size": 30, fill: "#E6FBF4", "text-anchor": "start" }, fmt(VALUE.raw));
  P3.tanh = makeBox(root, "tanh");
  P3.value = makeText(root, { "font-size": 52, fill: "#F4C76B", "text-anchor": "start" }, (VALUE.value >= 0 ? "+" : "") + fmt(VALUE.value));
  P3.meter = svg("g", {}, root);
  svg("rect", { x: 1000, y: 846, width: 820, height: 10, rx: 5, fill: "rgba(160,235,215,.18)" }, P3.meter);
  svg("rect", { x: 1409, y: 838, width: 2, height: 26, fill: "rgba(160,235,215,.5)" }, P3.meter);
  P3.marker = svg("circle", { cy: 851, r: 11, fill: "#F4C76B", stroke: "#06100D", "stroke-width": 2 }, P3.meter);
  for (const [x, text, anchor] of [[1000, "−1 · a sure loss", "start"], [1820, "a sure win · +1", "end"]])
    makeText(P3.meter, { "font-size": 16, fill: "#A9C9BC", "font-weight": 500, "text-anchor": anchor }).put(x, 892, 1, text);
}

function slotLine(c, node, to, colour, opacity) {
  // From the node on the board (a ring round it) to the top of its column.
  if (opacity <= 0) return;
  const p = toScreen(c, pos[node]), r = SIZE[NODES[node].type] * c.z * 0.75;
  svg("circle", { cx: p.x, cy: p.y, r, fill: "none", stroke: colour, "stroke-width": 3, opacity }, P3.lines);
  svg("path", { d: `M${p.x} ${p.y - r} C${p.x} ${p.y - 120} ${to.x} ${to.y - 120} ${to.x} ${to.y}`, fill: "none", stroke: colour,
    "stroke-width": 2.5, opacity: 0.85 * opacity, "stroke-linecap": "round" }, P3.lines);
}

function headScene(t, c) {
  const on = span(t, HD.move, HD.move + 0.6);
  $("heads").style.opacity = on;
  P3.bands.replaceChildren(); P3.lines.replaceChildren();
  if (on <= 0) return;
  const policy = 1 - span(t, HD.value, HD.value + 0.6);

  // The legal actions.
  const list = span(t, HD.list, HD.list + 0.5) * policy;
  P3.panel.style.opacity = list;
  P3.panelTitle.put(976, 176, list);
  P3.panelHead.put(1680, 176, list * span(t, HD.scoreFly + 0.6, HD.scoreFly + 0.9) * (1 - span(t, HD.softmax, HD.softmax + 0.4)));
  P3.softmax.put(1840, 176, list * span(t, HD.softmax, HD.softmax + 0.4));
  const soft = span(t, HD.softmax, HD.softmax + 1.0);
  ACTIONS.forEach((a, i) => {
    const r = P3.rows[i], y = 196 + i * 38;
    r.g.style.opacity = span(t, HD.list + 0.15 * i, HD.list + 0.15 * i + 0.4) * policy;
    r.hl.setAttribute("y", y);
    r.hl.style.opacity = i === HEADS.walk ? span(t, HD.slots, HD.slots + 0.4) * (1 - soft) : i === BEST ? soft : 0;
    r.text.put(976, y + 24, 1);
    const scored = i === HEADS.walk ? span(t, HD.scoreFly + 0.7, HD.scoreFly + 0.9)
      : span(t, HD.others + 0.25 * i, HD.others + 0.25 * i + 0.3);
    r.score.put(1680, y + 24, scored * (1 - soft));
    r.bar.setAttribute("y", y + 10); r.bar.setAttribute("width", 120 * a.probability * soft); r.bar.style.opacity = soft;
    r.pct.put(1846, y + 24, soft);
  });

  // The six slots: lines from the nodes they come from; the learned ones appear on their own.
  const slot = (k) => span(t, HD.slots + 0.3 + 0.35 * k, HD.slots + 0.8 + 0.35 * k);
  const join = span(t, HD.join, HD.join + 1.2), mlp = span(t, HD.mlp, HD.mlp + 0.5);
  const fly = span(t, HD.scoreFly, HD.scoreFly + 0.8), gone = 1 - span(t, HD.others, HD.others + 0.6);
  WALK.slots.forEach((v, k) => {
    const apart = { x: 960 + k * 76, y: HTOP, w: 22, h: HH }, together = { x: 1430, y: HTOP + k * HH / 6, w: 22, h: HH / 6 };
    const b = blendRect(apart, together, join);
    P3.slots[k].set(b.x, b.y, b.w, b.h / 128, slot(k) * (1 - span(t, HD.join + 1.0, HD.join + 1.2)) * policy);
    P3.slots[k].label.style.opacity = 1 - join;
    P3.slotNotes[k].put(apart.x + 11, HTOP + HH + 26, slot(k) * (1 - join) * policy);
    const node = WALK[SLOT_KEYS[k]];
    if (node != null) slotLine(c, node, { x: apart.x + 11, y: HTOP - 30 }, SLOTS[k][1], slot(k) * (1 - join) * policy);
  });
  P3.joined.set(1430, HTOP, 22, HH / (128 * 6), span(t, HD.join + 1.0, HD.join + 1.2) * gone);
  P3.mlp.set(1480, HTOP + HH / 2 - 50, 160, 100, mlp * gone);
  band({ x: 1452, y0: HTOP, y1: HTOP + HH }, { x: 1480, y0: HTOP + HH / 2 - 50, y1: HTOP + HH / 2 + 50 }, mlp * gone, P3.bands);
  band({ x: 1640, y0: HTOP + HH / 2 - 50, y1: HTOP + HH / 2 + 50 }, { x: 1668, y0: HTOP, y1: HTOP + HH }, span(t, HD.mlp + 0.4, HD.mlp + 0.8) * gone, P3.bands);
  P3.hidden.set(1668, HTOP, 22, HCELL, span(t, HD.mlp + 0.6, HD.mlp + 1.0) * gone);
  // The score, then up into its row.
  const row = { x: 1680, y: 196 + HEADS.walk * 38 + 24 };
  P3.score.setAttribute("text-anchor", fly > 0 ? "end" : "start");
  P3.score.put(lerp(1712, row.x, fly), lerp(HTOP + HH / 2 + 14, row.y, fly),
    span(t, HD.mlp + 1.2, HD.mlp + 1.6) * (1 - span(t, HD.scoreFly + 0.7, HD.scoreFly + 0.9)));

  // The value head: the game node and both players, joined, the MLP, tanh, and where that sits from -1 to +1.
  const value = span(t, HD.value + 0.4, HD.value + 0.8), vjoin = span(t, HD.vjoin, HD.vjoin + 1.0);
  const vmlp = span(t, HD.vmlp, HD.vmlp + 0.5), verdict = span(t, HD.verdict, HD.verdict + 0.8);
  VALUE.inputs.forEach((v, k) => {
    const shown = span(t, HD.value + 0.5 + 0.4 * k, HD.value + 1.0 + 0.4 * k);
    const apart = { x: 1000 + k * 90, y: HTOP - 120, w: 22, h: HH }, together = { x: 1300, y: HTOP - 120 + k * HH / 3, w: 22, h: HH / 3 };
    const b = blendRect(apart, together, vjoin);
    P3.vslots[k].set(b.x, b.y, b.w, b.h / 128, shown * (1 - span(t, HD.vjoin + 0.8, HD.vjoin + 1.0)));
    P3.vslots[k].label.style.opacity = 1 - vjoin;
    slotLine(c, VALUE.nodes[k], { x: apart.x + 11, y: HTOP - 150 }, VALUE_SLOTS[k][1], shown * (1 - vjoin));
  });
  const vy = HTOP - 120;
  P3.vjoined.set(1300, vy, 22, HH / (128 * 3), span(t, HD.vjoin + 0.8, HD.vjoin + 1.0));
  P3.vmlp.set(1350, vy + HH / 2 - 50, 160, 100, vmlp);
  band({ x: 1322, y0: vy, y1: vy + HH }, { x: 1350, y0: vy + HH / 2 - 50, y1: vy + HH / 2 + 50 }, vmlp, P3.bands);
  band({ x: 1510, y0: vy + HH / 2 - 50, y1: vy + HH / 2 + 50 }, { x: 1538, y0: vy, y1: vy + HH }, span(t, HD.vmlp + 0.4, HD.vmlp + 0.8), P3.bands);
  P3.vhidden.set(1538, vy, 22, HCELL, span(t, HD.vmlp + 0.6, HD.vmlp + 1.0));
  P3.raw.put(1580, vy + HH / 2 + 11, span(t, HD.vmlp + 1.0, HD.vmlp + 1.4));
  P3.tanh.set(1670, vy + HH / 2 - 30, 90, 60, span(t, HD.vmlp + 1.4, HD.vmlp + 1.8));
  P3.value.put(1774, vy + HH / 2 + 18, span(t, HD.vmlp + 1.8, HD.vmlp + 2.2));
  P3.value.setAttribute("text-anchor", "start");
  P3.meter.style.opacity = verdict;
  P3.marker.setAttribute("cx", 1410 + 410 * VALUE.value * verdict);
}

function headBeats() {
  const n = ACTIONS.length, best = ACTIONS[BEST], target = WALK.target != null ? NODES[WALK.target].label : "the enemy hero";
  return [
    [HD.move, "Part 3 · The heads", "From embeddings to a decision", "Two small networks read the final embeddings: the policy head chooses a move, the value head judges the position."],
    [HD.list, "The policy head", `One score for each legal move`, `There are ${n} moves here: attack with either unit, or end the turn.`],
    [HD.slots, `The policy head · ${WALK.text.replace("Attack: ", "Attack ")}`, "Six slots for one move",
      `The move's type (a learned vector), the card that acts, its target (${target}), the ability being decided and a choose-one option (unused here, so learned “empty” vectors), and the game node.`],
    [HD.join, "The policy head", `Joined end to end: ${WALK.slots.flat().length} numbers`, "Every move is described the same way, whatever the cards."],
    [HD.mlp, "The policy head", "An MLP turns them into one score", `${WALK.slots.flat().length} → ${WALK.hidden.length} (ReLU) → 1. The same weights score every move.`],
    [HD.others, "The policy head", "Every legal move is scored the same way", "Higher means the network likes it more."],
    [HD.softmax, "The policy head", "Softmax turns scores into probabilities",
      `The AI plays from these. Here it's ${Math.round(best.probability * 100)}% on ${best.text.replace("Attack: ", "attack ").replace("→", "→")}.`],
    [HD.value, "The value head", "Who's winning?", `It reads the game node and both player nodes: ${VALUE.inputs.length} × ${VALUE.inputs[0].length} = ${VALUE.inputs.flat().length} numbers.`],
    [HD.vmlp, "The value head", "An MLP, then tanh", `${VALUE.inputs.flat().length} → ${VALUE.hidden.length} (ReLU) → 1, squashed by tanh to between −1 and +1.`],
    [HD.verdict, "The value head", `${VALUE.value >= 0 ? "+" : ""}${fmt(VALUE.value)}: it thinks it's ${VALUE.value >= 0 ? "ahead" : "behind"}`,
      "Self-play trains this towards each game's real result, and the policy towards the moves that win more."],
  ];
}

// ------------------------------------------------------------------ captions
const name = () => card().label;
function beats() {
  const n = Object.keys(firstLit).length, types = new Set(focusEdges.map((e) => e.type)).size;
  const b = [
    [0, "The board", "A game in progress", "Two units a side. The cards in hand are left out to keep it simple."],
    [T.graph, "The state graph", "The network sees it as a graph", "A node for each card, each player and the game itself, and a little graph for each card's ability."],
    [T.zoom, "One node", `Take one card: ${name()}`, "Before the network does anything, a node is just a list of numbers."],
    [T.read, "Step 1 · Read it", "What the card is, and where it is now", `${FEATURES.filter((f) => f.group === "card").length} numbers for the card itself and ${FEATURES.filter((f) => f.group === "state").length} for its state, in the same order for every card. No name, no card ID.`],
    [T.scale, "Step 2 · Scale it", "Each one becomes a number from 0 to 1", "Costs and stats are divided by 10, numbered keywords by their largest value; yes or no is 1 or 0."],
    [T.collapse, "The feature vector", `${FEATURES.length} numbers: the card's input`, "Drawn as a column, as in the in-game GNN overlay: light is 1, grey is 0."],
    [T.split, "Step 3 · Embed it", `Into the network's own ${EMB.hidden} numbers`, `What the card is goes through the card encoder; its state joins on, and one more layer brings it all to ${EMB.hidden}. Both are learned in training.`],
    [T.dock, "The embedding", `${EMB.hidden} numbers: the node's starting point`, "Light is positive, dark is negative. Every node type gets its own encoder, so every node ends up the same size."],
    [T.pull, "Its neighbours", "Who this node is joined to", `${n} neighbours, joined by ${types} kinds of edge.`],
  ];
  EDGE_ORDER.forEach((type, k) => b.push([T.edges + k * T.edgeStep, "Its neighbours · " + EDGE_TEXT[type][0], EDGE_TEXT[type][0], EDGE_TEXT[type][1]]));
  b.push(...layerBeats(), ...headBeats());
  return b;
}
let BEATS = [], shownBeat = -1;
function caption(t) {
  const k = BEATS.findLastIndex((b) => Math.min(t, END - 1e-3) >= b[0]);  // the next part's first beat isn't this one's
  const next = BEATS[k + 1]?.[0] ?? Infinity, into = t - BEATS[k][0], out = next < END ? next - t : Infinity;
  $("caption").style.opacity = Math.min(clamp(into / 0.35), clamp(out / 0.25), clamp((t - START) / 0.5));
  if (k === shownBeat) return;
  shownBeat = k;
  const [, crumbs, what, how] = BEATS[k];
  $("crumbs").textContent = crumbs; $("what").innerHTML = rich(what); $("how").innerHTML = rich(how);
}

// ------------------------------------------------------------------ setup and playback
function fitStage() {
  const render = document.body.classList.contains("render");
  const room = { w: innerWidth, h: innerHeight - (render ? 0 : 52) };
  const s = render ? 1 : Math.min(room.w / W, room.h / H);
  $("stage").style.transform = `translate(${(room.w - W * s) / 2}px, ${(room.h - H * s) / 2}px) scale(${s})`;
}

let now = 0, playing = false, last = 0;
function seek(t) {
  now = Math.max(0, Math.min(DURATION, t));
  draw(START + now);
  $("scrub").value = now;
  $("play").textContent = playing ? "Pause" : "Play";
}
window.seek = seek;
function tick(ms) {
  if (!playing) return;
  seek(now + (ms - last) / 1000);
  last = ms;
  if (now >= DURATION) { playing = false; seek(now); return; }
  requestAnimationFrame(tick);
}
function toggle() {
  playing = !playing;
  if (playing) {
    if (now >= DURATION) now = 0;
    last = performance.now();
    requestAnimationFrame(tick);
  }
  seek(now);
}

async function init() {
  if (new URLSearchParams(location.search).has("render")) document.body.classList.add("render");
  await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 3000))]);
  if (TITLES[D.part]) document.querySelector(".title").innerHTML = `${TITLES[D.part][0]}<small>${TITLES[D.part][1]}</small>`;
  $("arena").style.backgroundImage = `url(${CARD_ART.background})`;
  layout();
  buildBoard();
  buildGraph();
  buildTable();
  buildColumn();
  buildLayer();
  buildHeads();
  BEATS = beats();
  $("scrub").max = DURATION;
  $("play").addEventListener("click", toggle);
  $("scrub").addEventListener("input", (e) => { playing = false; seek(+e.target.value); });
  addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); toggle(); }
    if (e.code === "ArrowRight") seek(now + 1 / 60);
    if (e.code === "ArrowLeft") seek(now - 1 / 60);
  });
  addEventListener("resize", fitStage);
  fitStage();
  seek(0);
  window.ready = true;
}
init();
</script>
